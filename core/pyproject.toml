[project]
name = "core"
version = "0.2.0"
description = "The core agent orchestration service for SICO."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "agent-framework==1.0.1",
    "agent-framework-redis == 1.0.0b260116",
    "betterproto2-compiler>=0.9.0",
    "betterproto2[all]>=0.9.1",
    "dotenv>=0.9.9",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "pydantic>=2.12.4",
    "mem0ai==2.0.1",
    "requests>=2.32.5",
    "kafka-python>=2.3.0",
    "pytest>=9.0.3",
    "ruff>=0.9.10",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "kubernetes>=35.0.0",
    "markitdown[all]>=0.1.5",
    "openpyxl>=3.1.5",
    "portalocker==3.2.0",
    "python-toon>=0.1.3",
    "json-schema-to-pydantic==0.4.7",
    "openai>=2.8.1",
    "azure-identity>=1.25.1",
    "azure-servicebus>=7.14.3",
    "azure-storage-blob>=12.25.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-instrumentation-grpc>=0.51b0",
    "truststore>=0.10.1",
    "fakeredis[lua]>=2.35.1",
    "pyyaml>=6.0.3",
    "langgraph==1.2.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v"
markers = ["e2e: drives a deployed stack; set SICO_E2E_BASE_URL to run"]

[tool.ruff]
extend-exclude = ["app/pb"]
line-length = 130
target-version = "py313"

# Size/complexity rules are part of the default lint gate.
#
# Reference thresholds:
#   E501   line-length (uses [tool.ruff].line-length = 130)
#   C901   mccabe cyclomatic complexity (see max-complexity below)
#   PLR0911 too-many-return-statements
#   PLR0912 too-many-branches
#   PLR0913 too-many-arguments
#   PLR0915 too-many-statements  -> ~function length (100 lines ≈ 60 stmts)
[tool.ruff.lint]
extend-select = ["E501", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 60
max-branches = 15
max-args = 7
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLR0912", "PLR0913", "C901"]
