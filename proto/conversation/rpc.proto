syntax = "proto3";
package rpc;

option go_package = "sico-backend/internal/transport/grpc/pb/conversation";

import "conversation/api.proto";

service ChatService {
  rpc StreamChat (api.ChatRequest) returns (api.ChatDirectResponse);
  rpc GetPlan (api.GetPlanRequest) returns (api.GetPlanResponse);
  rpc CancelPlan (api.CancelPlanRequest) returns (api.CancelPlanResponse);
  rpc GenerateOnboardRecommendationTasks (api.GenerateOnboardRecommendationTasksRequest) returns (api.GenerateOnboardRecommendationTasksResponse);
}
