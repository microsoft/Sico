syntax = "proto3";
package scheduledtask;

option go_package = "sico-backend/internal/transport/http/dto/scheduledtask";

import "common/common.proto";

message ScheduledTaskExtraInfo {
  bool send_email_on_complete = 1; // @gotag: json:"sendEmailOnComplete"
}

message ScheduledTask {
  int64 id = 1; // @gotag: json:"id"
  string name = 2; // @gotag: json:"name"
  bool enabled = 3; // @gotag: json:"enabled"
  int64 agent_instance_id = 4; // @gotag: json:"agentInstanceId"
  string creator_username = 5; // @gotag: json:"creatorUsername"
  string message = 6; // @gotag: json:"message"
  repeated common.Attachment attachments = 7; // @gotag: json:"attachments"
  string cron_expression = 8; // @gotag: json:"cronExpression"
  string timezone = 9; // @gotag: json:"timezone"
  int64 next_run_at = 10; // @gotag: json:"nextRunAt"
  int64 last_run_at = 11; // @gotag: json:"lastRunAt"
  int64 created_at = 12; // @gotag: json:"createdAt"
  int64 updated_at = 13; // @gotag: json:"updatedAt"
  ScheduledTaskExtraInfo extra_info = 14; // @gotag: json:"extraInfo,omitempty"
}

message CreateScheduledTaskRequest {
  string name = 1; // @gotag: json:"name" binding:"required"
  bool enabled = 2; // @gotag: json:"enabled"
  int64 agent_instance_id = 3; // @gotag: json:"agentInstanceId" binding:"required"
  string message = 4; // @gotag: json:"message" binding:"required"
  repeated common.Attachment attachments = 5; // @gotag: json:"attachments"
  string cron_expression = 6; // @gotag: json:"cronExpression" binding:"required"
  string timezone = 7; // @gotag: json:"timezone" binding:"required"
  ScheduledTaskExtraInfo extra_info = 8; // @gotag: json:"extraInfo,omitempty"
}

message CreateScheduledTaskResponse {
  ScheduledTask data = 1; // @gotag: json:"data"
  int32 code = 253; // @gotag: json:"code"
  string msg = 254; // @gotag: json:"msg"
}

message GetScheduledTaskRequest {
  int64 id = 1; // @gotag: form:"id" binding:"required"
}

message GetScheduledTaskResponse {
  ScheduledTask data = 1; // @gotag: json:"data"
  int32 code = 253; // @gotag: json:"code"
  string msg = 254; // @gotag: json:"msg"
}

message UpdateScheduledTaskRequest {
  int64 id = 1; // @gotag: json:"id" binding:"required"
  string name = 2; // @gotag: json:"name" binding:"required"
  bool enabled = 3; // @gotag: json:"enabled"
  int64 agent_instance_id = 4; // @gotag: json:"agentInstanceId" binding:"required"
  string message = 5; // @gotag: json:"message" binding:"required"
  repeated common.Attachment attachments = 6; // @gotag: json:"attachments"
  string cron_expression = 7; // @gotag: json:"cronExpression" binding:"required"
  string timezone = 8; // @gotag: json:"timezone" binding:"required"
  ScheduledTaskExtraInfo extra_info = 9; // @gotag: json:"extraInfo,omitempty"
}

message UpdateScheduledTaskResponse {
  ScheduledTask data = 1; // @gotag: json:"data"
  int32 code = 253; // @gotag: json:"code"
  string msg = 254; // @gotag: json:"msg"
}

message DeleteScheduledTaskRequest {
  int64 id = 1; // @gotag: json:"id" binding:"required"
}

message DeleteScheduledTaskResponse {
  int32 code = 253; // @gotag: json:"code"
  string msg = 254; // @gotag: json:"msg"
}

message ListScheduledTasksRequest {
  int32 page = 1; // @gotag: form:"page" binding:"required,min=1"
  int32 page_size = 2; // @gotag: form:"pageSize" binding:"required,min=1,max=100"
}

message ListScheduledTasksData {
  repeated ScheduledTask tasks = 1; // @gotag: json:"tasks"
  int64 total = 2; // @gotag: json:"total"
  bool has_next = 3; // @gotag: json:"hasNext"
}

message ListScheduledTasksResponse {
  ListScheduledTasksData data = 1; // @gotag: json:"data"
  int32 code = 253; // @gotag: json:"code"
  string msg = 254; // @gotag: json:"msg"
}
