apiVersion: v1
kind: Service
metadata:
  name: sico-backend
spec:
  type: {{ .Values.service.type }}
  selector:
    app: sico-backend
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
    - name: grpc
      port: {{ .Values.service.ports.grpc }}
      targetPort: grpc
