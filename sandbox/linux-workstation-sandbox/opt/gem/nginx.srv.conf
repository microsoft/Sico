# Health check - handled by nginx directly for efficiency
location = /health {
    default_type 'application/json';
    return 200 '{"status": "ok"}';
}

# Proxy all /v1/* API requests to the backend
location /v1/ {
    proxy_pass http://127.0.0.1:${GEM_SERVER_PORT};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}

# CDP (Chrome DevTools Protocol) with path stripping
location /cdp/ {
    proxy_pass http://127.0.0.1:${GEM_SERVER_PORT}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /cdp;
    proxy_read_timeout 300s;
}

# Legacy endpoints (for backwards compatibility)
location ~ ^/(tickets|screenshot|actions)$ {
    proxy_pass http://127.0.0.1:${GEM_SERVER_PORT};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
