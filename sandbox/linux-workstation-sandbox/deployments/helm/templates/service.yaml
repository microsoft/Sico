apiVersion: v1
kind: Service
metadata:
  name: linux-workstation-sandbox
spec:
  type: {{ .Values.service.type }}
  clusterIP: {{ .Values.service.clusterIP }}
  selector:
    app: linux-workstation-sandbox
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
