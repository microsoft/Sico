apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: linux-workstation-sandbox
  labels:
    app: linux-workstation-sandbox
spec:
  serviceName: linux-workstation-sandbox
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: linux-workstation-sandbox
  template:
    metadata:
      labels:
        app: linux-workstation-sandbox
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: linux-workstation-sandbox
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          env:
            - name: APP_VERSION
              value: "{{ .Chart.AppVersion }}"
          envFrom:
            - configMapRef:
                name: linux-workstation-sandbox-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
