[project]
name = "android-sandbox"
version = "0.1.0"
description = "FastAPI service for managing Android emulator instances (MuMu Player / AVD)"
requires-python = ">=3.13"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
	"fastapi==0.120.1",
	"uvicorn[standard]==0.30.6",
	"pydantic-settings==2.6.1",
	"python-multipart==0.0.29",
]

[project.optional-dependencies]
build = ["pyinstaller==6.18.0"]
test = ["pytest==9.0.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
exclude = ["setup*"]
